[package]
name = "hotwire-core"
version = "0.7.0"
edition = "2021"
description = "Shared Rust/WASM core for the HotWire hardware tool suite: Web Serial/WebUSB transport, binary framing & handshake protocol, esptool-js Web Flasher, and shared Leptos UI shell."
license = "Apache-2.0"

[features]
default = ["ui", "wasm"]
# Enables browser Web Serial / WebUSB / esptool-js bindings
wasm = [
  "dep:wasm-bindgen",
  "dep:wasm-bindgen-futures",
  "dep:js-sys",
  "dep:web-sys",
]
# Enables shared Leptos 0.7 UI components (TopToolbar, FlasherModal, BottomSheet, Theme)
ui = [
  "wasm",
  "dep:leptos",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
leptos = { version = "0.7", features = ["csr"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }

[dependencies.web-sys]
version = "0.3"
optional = true
features = [
  "Blob",
  "BlobPropertyBag",
  "Document",
  "DomRect",
  "Element",
  "Event",
  "EventTarget",
  "File",
  "FileList",
  "HtmlAnchorElement",
  "HtmlDivElement",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlSelectElement",
  "MouseEvent",
  "Navigator",
  "Performance",
  "PointerEvent",
  "Storage",
  "Url",
  "Window",
]

